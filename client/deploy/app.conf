# Shared by the HTTP and HTTPS servers (included inside a server block). No ${DOMAIN} here, so envsubst never touches it.
root /usr/share/nginx/html;
index index.html;
client_max_body_size 10m; # diet-plan uploads are limited to 8 MB by the API

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Camera and microphone are needed by the video consultation; other sensors are off.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /api/ {
  proxy_pass http://backend:5000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Socket.IO: video-consultation signalling (WebSocket, with long-polling as the fallback).
location /socket.io/ {
  proxy_pass http://backend:5000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s; # a consultation can last an hour
  proxy_send_timeout 3600s;
}

# Hashed build files never change. ("expires" is used instead of add_header so the security headers above are kept.)
location /assets/ { expires 1y; try_files $uri =404; }
location ~* \.(webp|jpg|jpeg|png|svg|ico|mp4|woff2)$ { expires 30d; try_files $uri =404; }

# Single-page app: unknown paths load index.html, never cached, so a new deploy shows up at once.
location / { expires -1; try_files $uri /index.html; }

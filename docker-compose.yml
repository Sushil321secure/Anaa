# Anaa Nutricare: MongoDB (private) + API (private) + nginx (the only public service, ports 80/443).
# Works on a VPS and on a laptop. Settings come from a root .env file (copy .env.example to .env).
#   docker compose up -d --build
# nginx serves HTTPS when a Let's Encrypt certificate for DOMAIN exists, and plain HTTP otherwise (see docs/DEPLOYMENT.md).
services:
  mongodb:
    # MongoDB 4.4: the UAT server's virtual CPU has no AVX, which MongoDB 5.0 and newer need to start. 4.4 is the newest without it.
    # On a server whose CPU has AVX you can use mongo:7 (and mongosh instead of mongo in the health check below).
    image: mongo:4.4
    restart: unless-stopped
    # No "ports": the database is reachable only from the API container, never from the internet.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks: [anaa_internal]
    healthcheck:
      # The official image clears MONGO_INITDB_ROOT_* inside the container once it has created the user, so the credentials
      # are filled in by Compose from .env instead. Until the user exists (first start) the login fails, so "healthy" means ready.
      test: ["CMD-SHELL", "mongo --quiet -u '${MONGO_ROOT_USER}' -p '${MONGO_ROOT_PASSWORD}' --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  backend:
    build: ./server
    restart: unless-stopped
    # No "ports": only nginx talks to the API, over the internal network.
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://${DOMAIN}}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/anaa_nutricare?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Anaa Nutricare <no-reply@localhost>}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    volumes:
      - api-storage:/app/storage
    networks: [anaa_internal]
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    # Default: this stack owns web ports 80/443. On a server where another site already uses them, set WEB_BIND=127.0.0.1 and
    # WEB_HTTP_PORT / WEB_HTTPS_PORT to free high ports, then let the existing web server forward this domain here.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80"
      - "${WEB_BIND:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # Certificates issued on the VPS. On a laptop (Windows/Mac) keep the defaults below from .env.example: an empty local folder is fine without HTTPS.
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro # renewal challenge files
    networks: [anaa_internal]
    depends_on:
      - backend

networks:
  anaa_internal:
    driver: bridge

volumes:
  mongo-data:
  api-storage:
